name: ci

on:
  push:
    branches: [main]
  pull_request:

# Every step is nix flake check, nix build or a find. None reads the
# token; checkout needs contents: read and nothing else.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: "experimental-features = nix-command flakes"

      # The manifest and its entry points, no symlinks, no pacman/yay,
      # shellcheck, qmllint, the Home Manager module and the behaviour test
      # -- all inside the flake check.
      - run: nix flake check --print-build-logs

      # aarch64 is evaluated, not built: there is no aarch64 runner here.
      - run: nix flake check --all-systems --no-build

      - run: nix build .#default --print-build-logs

      # The one rule a careless derivation breaks: omarchy-plugin-validate
      # refuses any symlink inside the plugin folder. `result` itself is a
      # symlink, so look inside what it points to.
      - name: no symlinks in the built plugin
        run: test -z "$(find "$(readlink -f result)" -mindepth 1 -type l)"

